name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Also build a debug APK and attach it to the run'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tests, lint, release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Only main writes the Gradle cache; branches read it, so they can't evict it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: chmod +x gradlew

      # One invocation shares configuration and compilation between the tasks.
      # --continue reports every failing task in a single run, not just the first.
      # assembleRelease has minify/shrink on, so it also catches broken R8 keep rules.
      - name: Unit tests, lint, release build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --continue --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: ignore

      - name: Build debug APK (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: bitDelta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
